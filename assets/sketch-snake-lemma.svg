<svg xmlns="http://www.w3.org/2000/svg" width="360" height="245" viewBox="0 0 360 245" fill="none" aria-hidden="true" focusable="false">
  <defs>
    <marker id="snake-arrow" viewBox="0 0 8 8" refX="6.6" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="m1 1 5.5 3L1 7" fill="none" stroke="#607365" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <g stroke="#607365" stroke-linecap="round" stroke-linejoin="round">
    <!-- Two exact rows and commuting vertical maps. -->
    <g stroke-width="1.45" marker-end="url(#snake-arrow)">
      <path d="M39 66c10-.7 17-.5 27 0"/><path d="M110 66c12-.4 24-.6 36 0"/><path d="M188 66c14-.5 26-.7 38 0"/><path d="M278 66c12-.6 23-.4 34 0"/>
